[project]
name = "multi-agent-medical-assistant"
version = "3.1.0"
description = "Multi-agent medical chatbot with RAG, image analysis, and speech"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/conftest.py",
    "*/__pycache__/*",
    "*.egg-info/*",
    "uploads/*",
    "data/*",
    "sample_images/*",
    "ingest_rag_data.py",
    "mcp_demo.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 30
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "C4", "PIE", "RUF", "PT"]
ignore = [
    "E501", "E741", "W2", "W3", "W6",
    "E401", "E402", "F401", "F841", "F541", "F821", "F811", "E711", "E722", "E731",
    "B008",  # function-call-in-default-argument (FastAPI Depends)
    "PT001", # pytest-fixture-incorrect-parentheses-style
    "PT017", # pytest-assert-in-except
    "SIM108",# if-else-block-instead-of-if-exp (readability preference)
    "SIM114",# if-with-same-arms
    "RUF003",# ambiguous-unicode-character-comment
    "B904",  # raise-without-from-inside-except
    "UP035", # deprecated-import (typing → collections.abc, low risk)
    "UP031", # printf-string-formatting (%-format is fine in logging)
    "UP038", # non-pep604-isinstance (Union[X,Y] in isinstance)
    "PT011", # pytest-raises-too-broad (too strict for existing tests)
    "B017",  # assert-raises-exception (same as PT011)
    "RUF001",# ambiguous-unicode-character-string (Chinese chars)
    "RUF002",# ambiguous-unicode-character-docstring (Chinese chars)
    "RUF012",# mutable-class-default
    "SIM112",# uncapitalized-environment-variables
    "SIM102",# collapsible-if (readability preference)
    "SIM105",# suppressible-exception (try/except vs contextlib.suppress)
]

[tool.ruff.format]
quote-style = "double"
