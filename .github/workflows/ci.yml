name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linting tools
        run: pip install ruff
      - name: Ruff check
        run: ruff check app.py agents/ middleware/ models.py config.py --select=E,F,W
      - name: Ruff format check
        run: ruff format --check app.py agents/ middleware/ models.py config.py || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install minimal dependencies
        run: |
          pip install fastapi uvicorn httpx pytest pytest-asyncio python-multipart
          pip install prometheus-client jinja2 aiofiles starlette cryptography
          pip install "pydantic>=2.0,<3.0" pydantic-settings
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install safety
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt || true
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build . --tag medical-chatbot:${{ github.sha }}
      - name: Verify container starts
        run: |
          docker run --rm -d --name test-container -p 8000:8000 \
            -e OPENAI_API_KEY=test \
            medical-chatbot:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop test-container
